name: yemen_drive_driver
description: Arabic RTL YemenDrive driver application using the shared GetX architecture.
publish_to: "none"
version: 1.1.25+28

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.2
  dio: ^5.9.0
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.3.1
  uuid: ^4.5.1
  sqflite: ^2.4.4+2
  country_picker: ^2.0.27
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  signalr_netcore: ^1.4.4
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  google_maps_flutter_platform_interface: ^2.16.1
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.3.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  geolocator_android:
    path: vendor/geolocator_android

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
    - assets/images/map/
  fonts:
    - family: SplashArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: BeINArabic
      fonts:
        - asset: assets/fonts/bein_ar_regular.ttf
          weight: 400
